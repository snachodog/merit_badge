<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Merit Badge{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --fg:#1b1b1b; --bg:#fafafa; --accent:#1f5f3f; --card:#fff; --line:#d0d0d0; }
    @media (prefers-color-scheme: dark) { :root { --fg:#eee; --bg:#161616; --accent:#6fcf97; --card:#222; --line:#444; } }
    * { box-sizing: border-box; }
    body { margin:0; font:1rem/1.5 system-ui,sans-serif; color:var(--fg); background:var(--bg); }
    header { display:flex; flex-wrap:wrap; gap:.5rem; justify-content:space-between; align-items:center; padding:.75rem 1rem; border-bottom:1px solid var(--line); }
    main { max-width:60rem; margin:0 auto; padding:1rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:.5rem; padding:1rem; }
    label { display:block; margin-top:.75rem; }
    input { width:100%; padding:.6rem; font:inherit; }
    button { margin-top:1rem; padding:.6rem 1rem; font:inherit; background:var(--accent); color:var(--bg); border:0; border-radius:.3rem; cursor:pointer; }
    header button { margin:0; background:none; color:var(--accent); border:1px solid var(--accent); }
    .errorlist { color:#b00020; padding-left:1.2rem; }
    a { color:var(--accent); }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline:3px solid #0b57d0; outline-offset:2px; }
    .skip { position:absolute; left:-999px; top:0; background:var(--card); padding:.5rem; z-index:10; }
    .skip:focus { left:0; }
    nav ul { display:flex; flex-wrap:wrap; gap:.25rem 1rem; list-style:none; margin:0; padding:0; }
    select, textarea { width:100%; padding:.5rem; font:inherit; }
    input[type=checkbox], input[type=radio] { width:auto; }
    .helptext { display:block; font-size:.9rem; opacity:.8; }
    .stack > * + * { margin-top:1rem; }
    .badge { display:inline-block; padding:.05rem .5rem; border:1px solid var(--line); border-radius:1rem; font-size:.85rem; white-space:nowrap; }
    .badge.official { border-color:var(--accent); font-weight:600; }
    .badge.warn { border-color:#b26a00; }
    .msg { padding:.6rem .8rem; border-left:4px solid var(--accent); background:var(--card); margin:.5rem 0; }
    .msg.error { border-color:#b00020; } .msg.warning { border-color:#b26a00; }
    .req-tree, .req-tree ol { list-style:none; margin:0; padding:0; }
    .req-tree ol { margin-left:1rem; padding-left:.75rem; border-left:2px solid var(--line); }
    .req { margin:.6rem 0; }
    .req .num { font-weight:700; margin-right:.4rem; }
    .req .meta { font-size:.9rem; display:flex; flex-wrap:wrap; gap:.25rem .6rem; margin-top:.25rem; }
    .req .logic { font-style:italic; margin:.25rem 0 0; }
    .controls { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.3rem; }
    .controls form { display:inline; }
    .controls button, .button { margin:0; padding:.25rem .6rem; font-size:.9rem; display:inline-block; text-decoration:none; }
    a.button { background:var(--accent); color:var(--bg); border-radius:.3rem; }
    button.secondary { background:none; color:var(--accent); border:1px solid var(--accent); }
    button.danger { background:#b00020; color:#fff; }
    table { border-collapse:collapse; width:100%; } th, td { text-align:left; padding:.3rem .5rem; border-bottom:1px solid var(--line); vertical-align:top; }
    .searchbar { display:flex; gap:.5rem; flex-wrap:wrap; } .searchbar input { flex:1 1 14rem; } .searchbar button { margin:0; }
    fieldset { border:1px solid var(--line); } .checks ul { list-style:none; padding:0; columns:2 10rem; } .checks label { display:inline; margin:0; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <strong>Merit Badge</strong>
    {% if user.is_authenticated %}
    <nav aria-label="Main"><ul>
      <li><a href="{% url 'home' %}">Home</a></li>
      <li><a href="{% url 'catalog' %}">Catalog</a></li>
      <li><a href="{% url 'program_create' %}">New custom program</a></li>
      <li><a href="{% url 'import_program' %}">Import JSON</a></li>
    </ul></nav>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<span>{{ user.get_username }}</span> <button type="submit">Log out</button></form>
    {% endif %}
  </header>
  <main id="main">
    {% if messages %}<div role="status">{% for m in messages %}<p class="msg {{ m.level_tag }}">{{ m }}</p>{% endfor %}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
