{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card card-body bg-base-100 border border-base-300 shadow-sm gap-3">
  <h1>{{ title }}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "catalog/_form_fields.html" %}
    <button type="submit" class="btn btn-primary">Save</button>
    {% if back_url %}<a class="btn btn-ghost" href="{{ back_url }}">Cancel</a>{% endif %}
  </form>
</div>
{% endblock %}
