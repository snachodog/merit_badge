{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card card-body bg-base-100 border border-base-300 shadow-sm gap-3">
  <h1>{{ title }}</h1>
  <p>Version {{ version.version_label }} of {{ version.award.name }}.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "catalog/_form_fields.html" %}
    <button type="submit" class="btn btn-primary">Save requirement</button>
    <a class="btn btn-ghost" href="{% url 'version_edit' version.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
