{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ title }}</h1>
  <p>Version {{ version.version_label }} of {{ version.award.name }}.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "catalog/_form_fields.html" %}
    <button type="submit">Save requirement</button>
    <a href="{% url 'version_edit' version.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
