name: Python Lint & Test

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        type: string
        default: "3.12"
      python-versions:
        description: JSON array of versions for matrix builds (overrides python-version)
        type: string
        default: ""
      working-directory:
        description: Directory containing pyproject.toml or requirements.txt
        type: string
        default: "."
      test-command:
        description: Command to run tests
        type: string
        default: "pytest"
      lint:
        description: Run ruff linter
        type: boolean
        default: true
      format-check:
        description: Run ruff format check
        type: boolean
        default: true

jobs:
  lint:
    name: Lint (ruff)
    if: inputs.lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: ruff check .

      - name: Format check
        if: inputs.format-check
        working-directory: ${{ inputs.working-directory }}
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ inputs.python-versions != '' && fromJson(inputs.python-versions) || fromJson(format('["{0}"]', inputs.python-version)) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev,test]" 2>/dev/null || pip install -e ".[test]" 2>/dev/null || pip install -e .
          elif [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov 2>/dev/null || true

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}
